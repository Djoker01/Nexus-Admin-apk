name: Build Nexus Admin APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Local properties created"

      - name: Create gradle wrapper directory
        run: |
          mkdir -p gradle/wrapper
          echo "Gradle wrapper directory created"

      - name: Create gradle-wrapper.properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << PROPEOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPEOF
          echo "gradle-wrapper.properties created"

      - name: Download gradle-wrapper.jar
        run: |
          wget -q -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          echo "gradle-wrapper.jar downloaded"

      - name: Create gradlew script
        run: |
          cat > gradlew << SCRIPTEOF
          #!/bin/bash
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "\$@"
          SCRIPTEOF
          chmod +x gradlew
          echo "gradlew script created"

      - name: Fix HorizontalDivider errors
        run: |
          find . -name "*.kt" -type f -exec sed -i 's/HorizontalDivider/Divider/g' {} +
          find . -name "*.kt" -type f -exec sed -i '/import.*HorizontalDivider/d' {} +
          echo "Kotlin errors fixed"

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "Build completed"

      - name: Check APK exists
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK found successfully"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "ERROR: APK not found"
            find . -name "*.apk" || echo "No APK files found"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAdmin-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
