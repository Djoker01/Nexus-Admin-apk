name: Build Nexus Admin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        
    - name: Fix Kotlin imports
      run: |
        echo "=== Corrigiendo imports en archivos Kotlin ==="
        
        # Función para agregar import si no existe
        add_import() {
          local file=$1
          local import_line=$2
          
          if [ -f "$file" ]; then
            if ! grep -q "$import_line" "$file"; then
              # Insertar después de la línea "package"
              sed -i "/^package/a $import_line" "$file"
              echo "  ✅ Agregado: $import_line"
            else
              echo "  ⏭️  Ya existe: $import_line"
            fi
          fi
        }
        
        # Corregir todos los archivos que necesitan HorizontalDivider
        echo ""
        echo "Corrigiendo HorizontalDivider..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "HorizontalDivider" {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.material3.HorizontalDivider"
        done
        
        # Corregir archivos que necesitan Alignment
        echo ""
        echo "Corrigiendo Alignment..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "Alignment\." {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.ui.Alignment"
        done
        
        # Corregir archivos que necesitan dp
        echo ""
        echo "Corrigiendo dp..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "\.dp" {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.ui.unit.dp"
        done
        
        # Corregir archivos que necesitan background
        echo ""
        echo "Corrigiendo background..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "\.background(" {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.foundation.background"
        done
        
        # Corregir archivos que necesitan clickable
        echo ""
        echo "Corrigiendo clickable..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "\.clickable" {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.foundation.clickable"
        done
        
        # Corregir archivos que necesitan fillMaxSize
        echo ""
        echo "Corrigiendo fillMaxSize/width/height..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "Modifier\.\(fillMaxSize\|width\|height\|padding\|size\)" {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.foundation.layout.*"
        done
        
        # Corregir archivos que necesitan Icons
        echo ""
        echo "Corrigiendo Icons..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "Icons\." {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.material.icons.Icons"
          add_import "$file" "import androidx.compose.material.icons.filled.*"
        done
        
        # Corregir archivos que necesitan MaterialTheme
        echo ""
        echo "Corrigiendo MaterialTheme..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "MaterialTheme" {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.material3.MaterialTheme"
        done
        
        # Corregir archivos que necesitan Text
        echo ""
        echo "Corrigiendo Text..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "Text(" {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.material3.Text"
        done
        
        # Corregir archivos que necesitan remember/LaunchedEffect
        echo ""
        echo "Corrigiendo Compose runtime..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "remember\|LaunchedEffect\|mutableStateOf" {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.runtime.*"
        done
        
        echo ""
        echo "=== Corrección de imports completada ==="
        
    - name: Install Gradle
      run: |
        echo "Instalando Gradle 8.5..."
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export GRADLE_HOME=$PWD/gradle-8.5
        export PATH=$GRADLE_HOME/bin:$PATH
        echo "GRADLE_HOME=$GRADLE_HOME" >> $GITHUB_ENV
        echo "$GRADLE_HOME/bin" >> $GITHUB_PATH
        gradle --version
        
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "✅ local.properties creado"
        
    - name: Create gradle-wrapper.properties
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        echo "✅ gradle-wrapper.properties creado"
        
    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5
        echo "✅ Gradle Wrapper generado"
        chmod +x gradlew
        
    - name: Verify fixes
      run: |
        echo "=== Verificando correcciones ==="
        echo "Archivos con HorizontalDivider sin import:"
        grep -rl "HorizontalDivider" app/src/main/java/ | while read file; do
          if ! grep -q "import androidx.compose.material3.HorizontalDivider" "$file"; then
            echo "  ❌ $file"
          else
            echo "  ✅ $file"
          fi
        done
        
    - name: Build Debug APK
      run: |
        echo "=== Compilando APK Debug ==="
        ./gradlew assembleDebug --stacktrace --no-daemon
        
    - name: Check APK
      run: |
        echo "=== Verificando APK generado ==="
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "✅ APK Debug generado exitosamente"
          echo "📦 Tamaño: $APK_SIZE"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
        else
          echo "❌ No se encontró el APK Debug"
          find . -name "*.apk" 2>/dev/null || echo "No se encontraron APKs"
          exit 1
        fi
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusAdmin-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
        
    - name: Build Release APK
      run: |
        echo "=== Generando keystore para release ==="
        keytool -genkey -v \
          -keystore app/nexus-admin.jks \
          -alias nexusadmin \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass nexusadmin123 \
          -keypass nexusadmin123 \
          -dname "CN=Nexus Admin, OU=Dev, O=Nexus, L=City, ST=State, C=US" \
          -noprompt 2>/dev/null || echo "Keystore ya existe"
          
        echo "=== Compilando APK Release ==="
        export KEYSTORE_PASSWORD=nexusadmin123
        export KEY_ALIAS=nexusadmin
        export KEY_PASSWORD=nexusadmin123
        ./gradlew assembleRelease --stacktrace --no-daemon || echo "⚠️ Release build failed"
      continue-on-error: true
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusAdmin-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 90
      continue-on-error: true
