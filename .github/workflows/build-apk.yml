name: Build Nexus Admin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        
    - name: Fix ALL Kotlin compatibility issues
      run: |
        echo "========================================="
        echo "  CORRIGIENDO ERRORES DE COMPILACIÓN"
        echo "========================================="
        
        # 1. Reemplazar HorizontalDivider -> Divider en todos los archivos
        echo "1. Reemplazando HorizontalDivider por Divider..."
        find app/src/main/java -name "*.kt" -type f -exec sed -i 's/HorizontalDivider/Divider/g' {} \;
        find app/src/main/java -name "*.kt" -type f -exec sed -i 's/import androidx.compose.material3.HorizontalDivider/import androidx.compose.material3.Divider/g' {} \;
        echo "   ✅ Hecho"
        
        # 2. Eliminar imports duplicados o incorrectos
        echo "2. Limpiando imports..."
        find app/src/main/java -name "*.kt" -type f -exec sed -i '/^import androidx.compose.material3.HorizontalDivider$/d' {} \;
        echo "   ✅ Hecho"
        
        # 3. Asegurar que todos los archivos tengan los imports básicos
        echo "3. Agregando imports esenciales..."
        for file in $(find app/src/main/java -name "*.kt" -type f); do
          # Verificar si ya tiene package declaration
          if grep -q "^package" "$file"; then
            # Lista de imports esenciales
            IMPORTS=(
              "import androidx.compose.material3.Divider"
              "import androidx.compose.foundation.layout.*"
              "import androidx.compose.ui.Alignment"
              "import androidx.compose.ui.Modifier"
              "import androidx.compose.ui.unit.dp"
              "import androidx.compose.foundation.clickable"
              "import androidx.compose.foundation.background"
            )
            
            for import_line in "${IMPORTS[@]}"; do
              import_check=$(echo "$import_line" | sed 's/\.\*//' | sed 's/import //')
              if ! grep -q "$import_check" "$file"; then
                sed -i "/^package/a $import_line" "$file"
              fi
            done
          fi
        done
        echo "   ✅ Hecho"
        
        # 4. Corregir RestockScreen específicamente
        echo "4. Corrigiendo RestockScreen..."
        RESTOK_FILE="app/src/main/java/com/nexus/admin/ui/screens/RestockScreen.kt"
        if [ -f "$RESTOK_FILE" ]; then
          # Reemplazar .clickable { por .clickable(onClick = {
          sed -i 's/\.clickable\s*{/.clickable(onClick = {/g' "$RESTOK_FILE"
          echo "   ✅ RestockScreen corregido"
        fi
        
        # 5. Verificar correcciones
        echo "5. Verificando correcciones..."
        REMAINING_ERRORS=$(grep -rn "HorizontalDivider" app/src/main/java/ 2>/dev/null | wc -l)
        echo "   HorizontalDivider restantes: $REMAINING_ERRORS"
        
        echo "========================================="
        echo "  CORRECCIONES COMPLETADAS"
        echo "========================================="
        
    - name: Install Gradle
      run: |
        echo "Instalando Gradle 8.5..."
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export GRADLE_HOME=$PWD/gradle-8.5
        export PATH=$GRADLE_HOME/bin:$PATH
        echo "GRADLE_HOME=$GRADLE_HOME" >> $GITHUB_ENV
        echo "$GRADLE_HOME/bin" >> $GITHUB_PATH
        gradle --version
        
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
    - name: Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        
    - name: Build Debug APK
      run: |
        echo "=== Compilando APK Debug ==="
        ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "=== ERRORES ENCONTRADOS ==="
          grep -E "^e:" build.log || true
          exit 1
        fi
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusAdmin-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90        done
        
        # Corregir archivos que necesitan Text
        echo ""
        echo "Corrigiendo Text..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "Text(" {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.material3.Text"
        done
        
        # Corregir archivos que necesitan remember/LaunchedEffect
        echo ""
        echo "Corrigiendo Compose runtime..."
        for file in $(find app/src/main/java -name "*.kt" -exec grep -l "remember\|LaunchedEffect\|mutableStateOf" {} \;); do
          echo "  Procesando: $file"
          add_import "$file" "import androidx.compose.runtime.*"
        done
        
        echo ""
        echo "=== Corrección de imports completada ==="
        
    - name: Install Gradle
      run: |
        echo "Instalando Gradle 8.5..."
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export GRADLE_HOME=$PWD/gradle-8.5
        export PATH=$GRADLE_HOME/bin:$PATH
        echo "GRADLE_HOME=$GRADLE_HOME" >> $GITHUB_ENV
        echo "$GRADLE_HOME/bin" >> $GITHUB_PATH
        gradle --version
        
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "✅ local.properties creado"
        
    - name: Create gradle-wrapper.properties
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        echo "✅ gradle-wrapper.properties creado"
        
    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5
        echo "✅ Gradle Wrapper generado"
        chmod +x gradlew
        
    - name: Verify fixes
      run: |
        echo "=== Verificando correcciones ==="
        echo "Archivos con HorizontalDivider sin import:"
        grep -rl "HorizontalDivider" app/src/main/java/ | while read file; do
          if ! grep -q "import androidx.compose.material3.HorizontalDivider" "$file"; then
            echo "  ❌ $file"
          else
            echo "  ✅ $file"
          fi
        done
        
    - name: Build Debug APK
      run: |
        echo "=== Compilando APK Debug ==="
        ./gradlew assembleDebug --stacktrace --no-daemon
        
    - name: Check APK
      run: |
        echo "=== Verificando APK generado ==="
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "✅ APK Debug generado exitosamente"
          echo "📦 Tamaño: $APK_SIZE"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
        else
          echo "❌ No se encontró el APK Debug"
          find . -name "*.apk" 2>/dev/null || echo "No se encontraron APKs"
          exit 1
        fi
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusAdmin-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
        
    - name: Build Release APK
      run: |
        echo "=== Generando keystore para release ==="
        keytool -genkey -v \
          -keystore app/nexus-admin.jks \
          -alias nexusadmin \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass nexusadmin123 \
          -keypass nexusadmin123 \
          -dname "CN=Nexus Admin, OU=Dev, O=Nexus, L=City, ST=State, C=US" \
          -noprompt 2>/dev/null || echo "Keystore ya existe"
          
        echo "=== Compilando APK Release ==="
        export KEYSTORE_PASSWORD=nexusadmin123
        export KEY_ALIAS=nexusadmin
        export KEY_PASSWORD=nexusadmin123
        ./gradlew assembleRelease --stacktrace --no-daemon || echo "⚠️ Release build failed"
      continue-on-error: true
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusAdmin-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 90
      continue-on-error: true
