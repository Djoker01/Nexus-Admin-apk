name: Build Nexus Admin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Download Gradle Wrapper
      run: |
        echo "Descargando Gradle Wrapper..."
        mkdir -p gradle/wrapper
        
        # Descargar gradle-wrapper.jar
        curl -L https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle-8.5-bin.zip
        unzip -q /tmp/gradle-8.5-bin.zip -d /tmp/
        cp /tmp/gradle-8.5/lib/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
        
        # Si no funciona, descargar directamente desde GitHub
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Descargando gradle-wrapper.jar desde Maven Central..."
          curl -L https://repo1.maven.org/maven2/org/gradle/gradle-wrapper/8.5/gradle-wrapper-8.5.jar -o gradle/wrapper/gradle-wrapper.jar
        fi
        
        # Crear gradlew si no existe
        if [ ! -f "gradlew" ]; then
          echo "Creando gradlew..."
          cat > gradlew << 'EOF'
#!/bin/sh
##############################################################################
## Gradle start up script for UN*X
##############################################################################

# Attempt to set APP_HOME
PRG="$0"
while [ -h "$PRG" ] ; do
    ls=`ls -ld "$PRG"`
    link=`expr "$ls" : '.*-> \(.*\)$'`
    if expr "$link" : '/.*' > /dev/null; then
        PRG="$link"
    else
        PRG=`dirname "$PRG"`"/$link"
    fi
done
SAVED="`pwd`"
cd "`dirname \"$PRG\"`/" >/dev/null
APP_HOME="`pwd -P`"
cd "$SAVED" >/dev/null

APP_NAME="Gradle"
APP_BASE_NAME=`basename "$0"`

DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'

MAX_FD="maximum"

warn () {
    echo "$*"
}

die () {
    echo
    echo "$*"
    echo
    exit 1
}

OS_NAME="`uname`"
case "$OS_NAME" in
  CYGWIN* | MINGW* )
    SEPARATOR=";"
    ;;
  *)
    SEPARATOR=":"
    ;;
esac

CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar

if [ -n "$JAVA_HOME" ] ; then
    JAVACMD="$JAVA_HOME/bin/java"
else
    JAVACMD="java"
fi

if [ ! -x "$JAVACMD" ] ; then
    die "ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH."
fi

exec "$JAVACMD" $DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS \
  -classpath "$CLASSPATH" \
  org.gradle.wrapper.GradleWrapperMain "$@"
EOF
        fi
        
        chmod +x gradlew
        
        # Verificar
        echo "Verificando instalación..."
        ls -la gradlew
        ls -la gradle/wrapper/gradle-wrapper.jar
        echo "Gradle Wrapper instalado correctamente"
      
    - name: Verify Gradle Wrapper
      run: |
        if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "✅ Gradle Wrapper verificado correctamente"
          ./gradlew --version || echo "⚠️  Gradle necesita configuración adicional"
        else
          echo "❌ Error: Gradle Wrapper no instalado"
          exit 1
        fi
      
    - name: Build Debug APK
      run: |
        echo "Construyendo APK de debug..."
        ./gradlew assembleDebug --stacktrace --info
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusAdmin-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
      continue-on-error: true
        
    - name: Create keystore for release
      run: |
        echo "Creando keystore para release..."
        keytool -genkey -v \
          -keystore app/nexus-admin.jks \
          -alias nexusadmin \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass nexusadmin \
          -keypass nexusadmin \
          -dname "CN=Nexus Admin, OU=Dev, O=Nexus, L=City, S=State, C=US" \
          -noprompt 2>/dev/null || echo "Keystore ya existe o hubo un error menor"
      
    - name: Build Release APK
      run: |
        echo "Construyendo APK de release..."
        ./gradlew assembleRelease --stacktrace
      continue-on-error: true
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusAdmin-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
      continue-on-error: true
      
    - name: Build Status
      run: |
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ APK Debug generado exitosamente"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
        else
          echo "❌ No se pudo generar el APK Debug"
        fi
        
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          echo "✅ APK Release generado exitosamente"
          ls -lh app/build/outputs/apk/release/app-release.apk
        fi
