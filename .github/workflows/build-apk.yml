name: Build Nexus Admin APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << PROPEOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPEOF
          wget -q -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          printf '#!/bin/bash\njava -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"\n' > gradlew
          chmod +x gradlew

      - name: Fix all Kotlin files
        run: |
          echo "Reemplazando HorizontalDivider..."
          find . -name "*.kt" -type f -exec sed -i 's/HorizontalDivider/Divider/g' {} +
          find . -name "*.kt" -type f -exec sed -i '/import.*HorizontalDivider/d' {} +

      - name: Fix RestockScreen line by line
        run: |
          echo "Limpiando RestockScreen.kt..."
          
          # Eliminar la línea 3 problemática y reconstruir el archivo
          RESTOCK="app/src/main/java/com/nexus/admin/ui/screens/RestockScreen.kt"
          
          # Crear archivo temporal limpio
          python3 << PYEOF
          import re

          content = []
          content.append("package com.nexus.admin.ui.screens")
          content.append("")
          content.append("import androidx.compose.foundation.clickable")
          content.append("import androidx.compose.foundation.layout.*")
          content.append("import androidx.compose.foundation.lazy.LazyColumn")
          content.append("import androidx.compose.foundation.lazy.items")
          content.append("import androidx.compose.material.icons.Icons")
          content.append("import androidx.compose.material.icons.filled.*")
          content.append("import androidx.compose.material3.*")
          content.append("import androidx.compose.runtime.*")
          content.append("import androidx.compose.ui.Alignment")
          content.append("import androidx.compose.ui.Modifier")
          content.append("import androidx.compose.ui.platform.LocalContext")
          content.append("import androidx.compose.ui.text.font.FontWeight")
          content.append("import androidx.compose.ui.unit.dp")
          content.append("import com.nexus.admin.data.AppDatabase")
          content.append("import com.nexus.admin.data.entity.*")
          content.append("import com.nexus.admin.ui.theme.*")
          content.append("import com.nexus.admin.utils.Utils")
          content.append("import kotlinx.coroutines.launch")

          with open("$RESTOCK", "w") as f:
              f.write("\\n".join(content))
          
          print("Archivo base creado")
          PYEOF
          
          echo "RestockScreen.kt limpiado"

      - name: Add RestockScreen code body
        run: |
          RESTOCK="app/src/main/java/com/nexus/admin/ui/screens/RestockScreen.kt"
          
          cat >> "$RESTOCK" << 'BODY'
          
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun RestockScreen() {
              val context = LocalContext.current
              val db = remember { AppDatabase.getDatabase(context) }
              val scope = rememberCoroutineScope()
              var restocks by remember { mutableStateOf<List<Restock>>(emptyList()) }
              var showAddDialog by remember { mutableStateOf(false) }
              var monthRestocks by remember { mutableStateOf(0.0) }
              var productsRestocked by remember { mutableStateOf(0) }
              var restockCount by remember { mutableStateOf(0) }
              
              LaunchedEffect(Unit) {
                  db.restockDao().getAllRestocks().collect { restockList ->
                      restocks = restockList
                      val (monthStart, monthEnd) = Utils.getMonthRange()
                      val monthList = restockList.filter { it.date in monthStart..monthEnd }
                      monthRestocks = monthList.sumOf { it.total }
                      productsRestocked = monthList.sumOf { it.products.size }
                      restockCount = monthList.size
                  }
              }
              
              Column(modifier = Modifier.fillMaxSize()) {
                  Row(modifier = Modifier.fillMaxWidth().padding(16.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                      Text("Reabastecimiento", style = MaterialTheme.typography.headlineMedium, fontWeight = FontWeight.Bold)
                      Button(onClick = { showAddDialog = true }) {
                          Icon(Icons.Filled.ShoppingCart, contentDescription = null)
                          Spacer(modifier = Modifier.width(4.dp))
                          Text("Nueva Compra")
                      }
                  }
                  Row(modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Card(modifier = Modifier.weight(1f)) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("Compras Mes", style = MaterialTheme.typography.bodySmall)
                              Text("$" + Utils.formatCurrency(monthRestocks), fontWeight = FontWeight.Bold, color = Blue)
                          }
                      }
                      Card(modifier = Modifier.weight(1f)) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("Productos", style = MaterialTheme.typography.bodySmall)
                              Text("$productsRestocked", fontWeight = FontWeight.Bold)
                          }
                      }
                      Card(modifier = Modifier.weight(1f)) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Text("Compras", style = MaterialTheme.typography.bodySmall)
                              Text("$restockCount", fontWeight = FontWeight.Bold)
                          }
                      }
                  }
                  LazyColumn(modifier = Modifier.fillMaxSize(), contentPadding = PaddingValues(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(restocks) { restock ->
                          Card(modifier = Modifier.fillMaxWidth()) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text(restock.supplier, fontWeight = FontWeight.SemiBold)
                                      Text(Utils.formatDate(restock.date), style = MaterialTheme.typography.bodySmall)
                                  }
                                  Text(restock.products.joinToString(", ") { it.name + " x" + it.quantity }, style = MaterialTheme.typography.bodySmall)
                                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text("Total:")
                                      Text("$" + Utils.formatCurrency(restock.total), fontWeight = FontWeight.Bold, color = Green)
                                  }
                              }
                          }
                      }
                  }
              }
              
              if (showAddDialog) {
                  var supplier by remember { mutableStateOf("") }
                  var selectedProducts by remember { mutableStateOf<List<Pair<Product, Int>>>(emptyList()) }
                  var allProducts by remember { mutableStateOf<List<Product>>(emptyList()) }
                  var showProductPicker by remember { mutableStateOf(false) }
                  LaunchedEffect(Unit) { db.productDao().getAllProducts().collect { allProducts = it } }
                  
                  AlertDialog(onDismissRequest = { showAddDialog = false }, title = { Text("Nuevo Reabastecimiento") }, text = {
                      Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          OutlinedTextField(value = supplier, onValueChange = { supplier = it }, label = { Text("Proveedor") }, singleLine = true)
                          OutlinedButton(onClick = { showProductPicker = true }, modifier = Modifier.fillMaxWidth()) {
                              Icon(Icons.Filled.Add, contentDescription = null)
                              Text("Agregar Producto")
                          }
                          selectedProducts.forEachIndexed { index, (product, qty) ->
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(product.name, fontWeight = FontWeight.Medium)
                                      Text("Costo: $" + Utils.formatCurrency(product.cost) + " x $qty")
                                  }
                                  IconButton(onClick = { selectedProducts = selectedProducts.toMutableList().also { it.removeAt(index) } }) {
                                      Icon(Icons.Filled.RemoveCircle, contentDescription = "Eliminar", tint = Red)
                                  }
                              }
                          }
                          val total = selectedProducts.sumOf { it.first.cost * it.second }
                          Text("Total: $" + Utils.formatCurrency(total), style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold, color = Green)
                      }
                  }, confirmButton = {
                      Button(onClick = {
                          scope.launch {
                              val total = selectedProducts.sumOf { it.first.cost * it.second }
                              val restock = Restock(supplier = supplier, products = selectedProducts.map { (product, qty) -> RestockProduct(product.id, product.name, qty, product.cost) }, total = total)
                              db.restockDao().insert(restock)
                              selectedProducts.forEach { (product, qty) -> db.productDao().update(product.copy(stock = product.stock + qty)) }
                              showAddDialog = false
                          }
                      }) { Text("Registrar Compra") }
                  }, dismissButton = { TextButton(onClick = { showAddDialog = false }) { Text("Cancelar") } })
                  
                  if (showProductPicker) {
                      AlertDialog(onDismissRequest = { showProductPicker = false }, title = { Text("Seleccionar Producto") }, text = {
                          LazyColumn {
                              items(allProducts) { product ->
                                  ListItem(headlineContent = { Text(product.name) }, supportingContent = { Text("Stock: " + product.stock + " | Costo: $" + Utils.formatCurrency(product.cost)) }, modifier = Modifier.clickable { selectedProducts = selectedProducts + (product to 1); showProductPicker = false })
                              }
                          }
                      }, confirmButton = { TextButton(onClick = { showProductPicker = false }) { Text("Cancelar") } })
                  }
              }
          }
          BODY
          
          echo "RestockScreen.kt completo"
          head -5 "$RESTOCK"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAdmin-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
