name: Build Nexus Admin APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create gradle wrapper directory
        run: mkdir -p gradle/wrapper

      - name: Create gradle-wrapper.properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << PROPEOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPEOF

      - name: Download gradle-wrapper.jar
        run: wget -q -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar

      - name: Create gradlew script
        run: |
          cat > gradlew << SCRIPTEOF
          #!/bin/bash
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "\$@"
          SCRIPTEOF
          chmod +x gradlew

      - name: Fix HorizontalDivider errors
        run: |
          find . -name "*.kt" -type f -exec sed -i 's/HorizontalDivider/Divider/g' {} +
          find . -name "*.kt" -type f -exec sed -i '/import.*HorizontalDivider/d' {} +

      - name: Fix RestockScreen clickable error
        run: |
          RESTOK_FILE="app/src/main/java/com/nexus/admin/ui/screens/RestockScreen.kt"
          if [ -f "$RESTOK_FILE" ]; then
            echo "Corrigiendo RestockScreen..."
            sed -i 's/\.clickable\b/\.clickable(/g' "$RESTOK_FILE"
            sed -i 's/Modifier\.clickable(/Modifier.clickable(onClick = /g' "$RESTOK_FILE"
            echo "RestockScreen corregido"
          else
            echo "RestockScreen no encontrado en la ruta esperada"
            find . -name "RestockScreen.kt" -type f
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAdmin-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
