name: Build Nexus Admin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        
    - name: Install Gradle
      run: |
        echo "Instalando Gradle 8.5..."
        wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        export GRADLE_HOME=$PWD/gradle-8.5
        export PATH=$GRADLE_HOME/bin:$PATH
        echo "GRADLE_HOME=$GRADLE_HOME" >> $GITHUB_ENV
        echo "$GRADLE_HOME/bin" >> $GITHUB_PATH
        gradle --version
        
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "✅ local.properties creado"
        
    - name: Create gradle-wrapper.properties
      run: |
        mkdir -p gradle/wrapper
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        echo "✅ gradle-wrapper.properties creado"
        
    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.5
        echo "✅ Gradle Wrapper generado"
        ls -la gradlew
        ls -la gradle/wrapper/
        
    - name: Make gradlew executable
      run: |
        chmod +x gradlew
        echo "✅ gradlew es ejecutable"
        
    - name: Verify setup
      run: |
        echo "=== Verificando configuración ==="
        echo "Java version:"
        java -version
        echo ""
        echo "Gradle version:"
        ./gradlew --version
        echo ""
        echo "Android SDK:"
        echo $ANDROID_HOME
        echo ""
        echo "Archivos del proyecto:"
        ls -la
        echo ""
        echo "Gradle wrapper:"
        ls -la gradle/wrapper/
        
    - name: Build Debug APK
      run: |
        echo "=== Compilando APK Debug ==="
        ./gradlew assembleDebug --stacktrace --no-daemon --warning-mode all
        
    - name: Check APK
      run: |
        echo "=== Verificando APK generado ==="
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "✅ APK Debug generado exitosamente"
          echo "📦 Tamaño: $APK_SIZE"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
        else
          echo "❌ No se encontró el APK Debug"
          echo "Buscando archivos APK..."
          find . -name "*.apk" 2>/dev/null || echo "No se encontraron APKs"
          echo ""
          echo "Contenido del directorio de build:"
          find app/build -type f 2>/dev/null | head -20
          exit 1
        fi
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NexusAdmin-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 90
        
    - name: Build Release APK (opcional)
      run: |
        echo "=== Generando keystore para release ==="
        keytool -genkey -v \
          -keystore app/nexus-admin.jks \
          -alias nexusadmin \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass nexusadmin123 \
          -keypass nexusadmin123 \
          -dname "CN=Nexus Admin, OU=Dev, O=Nexus, L=City, ST=State, C=US" \
          -noprompt 2>/dev/null || echo "Keystore ya existe"
          
        echo "=== Compilando APK Release ==="
        export KEYSTORE_PASSWORD=nexusadmin123
        export KEY_ALIAS=nexusadmin
        export KEY_PASSWORD=nexusadmin123
        ./gradlew assembleRelease --stacktrace --no-daemon || echo "⚠️ Release build failed, pero el APK Debug está listo"
      continue-on-error: true
      
    - name: Upload Release APK (opcional)
      uses: actions/upload-artifact@v4
      with:
        name: NexusAdmin-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 90
      continue-on-error: true
